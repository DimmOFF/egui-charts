[package]
name = "egui-charts-demo"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "egui-charts-demo"

[workspace]

[[bin]]
name = "egui-charts-demo"
path = "main.rs"

# The assembled terminal on Deriv's and Binance's public endpoints; see `trading_vision.rs`.
[[bin]]
name = "TradingVision"
path = "trading_vision.rs"

[dependencies]
egui-charts = { path = "../..", features = ["ui", "alert-engine", "strategies", "detectors"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "persistence"] }
# The emoji fonts draw the icons the drawing bar's Icons/Emojis menu places.
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
# Embedded SVGs and validated PNG/JPEG bytes; native builds also load local files.
egui_extras = { version = "0.37.0", default-features = false, features = ["svg", "image"] }
chrono = "0.4.43"
log = "0.4.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17.2"

# Native gets the windowing backends and the system clipboard.
# WASM uses the canvas backend and browser downloads.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui_extras = { version = "0.37.0", default-features = false, features = ["file"] }
maudio = "0.1.15"
# Deriv WebSocket client for the `deriv` binary.
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# Own data: REST history and the WebSocket stream of a visitor's source. The browser build
# uses the page's own fetch and WebSocket instead.
ehttp = "0.7.2"
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
# `tokio-tungstenite` enables rustls without choosing a crypto provider.
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.7"
# Binance klines are a plain REST call; the quotes and ticks come over WebSocket.
# `gzip` shrinks `exchangeInfo` from 18 MB to about 0.3 MB on the wire.
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
# The assembled terminal: toolbars, panels, dialogs and a chart on the same feed.
egui-charts-terminal = { path = "../../terminal" }
# MetaTrader 5 over the terminal's local named pipe, without the Python package.
mt5-rs = "0.1"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "glow", "links", "x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Check recording size before the browser allocates its bytes.
rfd = { version = "0.17.2", features = ["file-handle-inner"] }
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4.58"
web-sys = { version = "0.3.85", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioDestinationNode", "AudioNode", "AudioContextState", "WebSocket", "MessageEvent", "CloseEvent", "BinaryType", "RequestInit", "RequestMode", "Response", "Headers"] }
console_error_panic_hook = "0.1.7"

# `index.html` builds the web release with this profile; native builds keep `release`.
# The same as the library's `wasm-release`, which explains the settings.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1

# Frame-driven tests also generate synthetic history in the demo itself.
[profile.test]
opt-level = 2

# Keep dependencies optimised; the chart uses level 1 because it is rebuilt on every change.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.egui-charts]
opt-level = 1
