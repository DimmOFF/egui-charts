[package]
name = "egui-charts-pine"
version = "0.1.0"
edition = "2024"
publish = false

# The chart library is a published crate of its own; this one only builds beside it, like
# `examples/demo`.
[workspace]

[dependencies]
egui = "0.37.0"
egui-charts = { path = "../..", default-features = false, features = ["widget", "studies", "drawings", "timezones"] }
chrono = "0.4.43"
# `str.match` takes Pine's regular expressions.
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The editor's Import and Export file dialogs.
rfd = { version = "0.17.2", optional = true }

log = { version = "0.4.29", optional = true }
# The store's hashes, identifiers, atomic writes and typed errors.
sha2 = { version = "0.10", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
tempfile = { version = "3", optional = true }
thiserror = { version = "2", optional = true }
directories = { version = "6", optional = true }

[features]
default = ["study", "editor"]
# `PineStudy`: a script as the chart's `Indicator`.
study = []
# The script store: `.pine` files, metadata, history and presets.
store = [
    "dep:directories",
    "dep:log",
    "dep:sha2",
    "dep:tempfile",
    "dep:thiserror",
    "dep:uuid",
]
# `PineScripts`: the editor panel. Needs the chart's widgets and theme.
editor = ["study", "store", "egui-charts/ui", "dep:rfd"]
